<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV BD</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body {margin:0;font-family:Arial;background:#0a0a0a;color:#fff;}
header {background:#000;padding:15px;text-align:center;border-bottom:2px solid #e50914;}
header h2 {margin:0;color:#e50914;}
.container {padding:15px;max-width:1300px;margin:auto;}
video {width:100%;max-height:65vh;background:#000;border-radius:8px;}
.channel-list {display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:15px;}
.channel {background:#1e1e1e;padding:12px;text-align:center;border-radius:6px;cursor:pointer;font-size:14px;border:1px solid #333;}
.channel:hover {background:#e50914;}
.loading,.error {text-align:center;padding:30px;color:#888;}
.error {color:#ff4444;}
</style>
</head>
<body>
<header><h2>Live TV Bangladesh</h2></header>
<div class="container">
  <video id="video" controls autoplay muted></video>
  <div class="channel-list" id="channels">
    <div class="loading">Loading channels...</div>
  </div>
</div>

<script>
const proxy = "https://api.allorigins.win/raw?url=";
const m3uUrl = "https://raw.githubusercontent.com/ar-rony/smartiptv-playlist/master/MYIPTVLIST.m3u";

async function loadM3U() {
  try {
    let res = await fetch(proxy + encodeURIComponent(m3uUrl));
    if(!res.ok) throw new Error("Server error: " + res.status);
    let text = await res.text();
    if(!text.includes("#EXTM3U")) throw new Error("Invalid M3U");
    parseM3U(text);
  } catch(e) {
    document.getElementById('channels').innerHTML = `<div class="error">Failed to load.<br>Error: ${e.message}<br><br>Turn on Desktop site in Chrome menu.</div>`;
  }
}

function parseM3U(data) {
  let lines = data.split('\n');
  let channels = [];
  let name = "Channel";

  for(let i=0; i<lines.length; i++) {
    if(lines[i].startsWith('#EXTINF')) {
      let match = lines[i].match(/,(.*)$/);
      name = match && match[1]? match[1].trim() : "Channel";
    } else if(lines[i].startsWith('http') && lines[i].includes('.m3u8')) {
      channels.push({name: name, url: lines[i].trim()});
    }
  }

  if(channels.length === 0) {
    document.getElementById('channels').innerHTML = `<div class="error">No channels found.</div>`;
    return;
  }

  document.getElementById('channels').innerHTML = "";
  channels.forEach(ch => {
    let div = document.createElement('div');
    div.className = 'channel';
    div.innerText = ch.name;
    div.onclick = () => playChannel(ch.url);
    document.getElementById('channels').appendChild(div);
  });

  playChannel(channels[0].url);
}

function playChannel(url) {
  if(window.hls) window.hls.destroy();
  if(Hls.isSupported()) {
    window.hls = new Hls();
    window.hls.loadSource(url);
    window.hls.attachMedia(document.getElementById('video'));
  } else {
    document.getElementById('video').src = url;
  }
  document.getElementById('video').play().catch(e => console.log(e));
}

loadM3U();
</script>
</body>
</html>
