<script>
var video = document.getElementById('mainPlayer');
var ytPlayer = document.getElementById('ytPlayer');
var hls;

function playChannel(m3u8Link, ytId, name){
  document.getElementById('channelName').innerText = name;
  
  if(m3u8Link && m3u8Link !== ''){
    ytPlayer.style.display = 'none';
    video.style.display = 'block';
    if(Hls.isSupported()){
      if(hls) hls.destroy();
      hls = new Hls();
      hls.loadSource(m3u8Link);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, ()=>video.play());
      hls.on(Hls.Events.ERROR, ()=>fallbackToYT(ytId));
    }else{
      video.src = m3u8Link;
      video.play();
    }
  }else{
    fallbackToYT(ytId);
  }

  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  event.currentTarget.classList.add('active');
}

function fallbackToYT(ytId){
  video.style.display = 'none';
  ytPlayer.style.display = 'block';
  ytPlayer.src = 'https://www.youtube.com/embed/live_stream?channel=' + ytId + '&autoplay=1';
}

window.onload = function(){
  playChannel('','UCUo_ITVZtR1XbZ6UMiEeqw','Channel 24');
}
</script>
