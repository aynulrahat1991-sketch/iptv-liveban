<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV লাইভ</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
  body { background:#121212; color:#fff; }
  .header { display:flex; align-items:center; gap:10px; padding:15px; background:#1e1e1e; }
  .logo { width:35px; height:35px; background:#e91e63; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .header h1 { font-size:18px; }
  .player { margin:10px 15px; border-radius:12px; overflow:hidden; border:2px solid #e91e63; }
  .player iframe { width:100%; height:220px; border:none; }
  .channel-info { padding:12px; background:#1e1e1e; display:flex; align-items:center; gap:10px; }
  .live-badge { margin-left:auto; background:red; padding:5px 12px; border-radius:20px; font-size:12px; font-weight:bold; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; padding:15px; }
  .card { background:#1e1e1e; border-radius:10px; padding:15px; text-align:center; cursor:pointer; }
  .card.active { border:2px solid #e91e63; }
  .card img { width:50px; height:50px; margin-bottom:8px; }
  .card p { font-size:13px; margin-bottom:5px; }
  .card .views { color:#4caf50; font-size:12px; }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">📡</div>
    <h1>IPTV লাইভ</h1>
  </div>

  <div class="player">
    <iframe id="mainPlayer" src="https://www.youtube.com/embed/live_stream?channel=UCUo_lTVZtRlXxbz6UMiEeqw" allowfullscreen></iframe>
    <div class="channel-info">
      <div>
        <div>T Sports HD</div>
        <small>Sports</small>
      </div>
      <div class="live-badge">● LIVE</div>
    </div>
  </div>

  <div class="grid">
    <div class="card active" onclick="playChannel('UCUo_lTVZtRlXxbz6UMiEeqw')">
      <img src="https://i.ibb.co/7k6QwQp/tsports.png">
      <p>T Sports HD</p>
      <div class="views">● LIVE</div>
    </div>
    <div class="card" onclick="playChannel('UCN0EYV0oLdiQ7kCy1hb_UUA')">
      <img src="https://i.ibb.co/6wQmY7d/ptvsports.png">
      <p>PTV Sports</p>
      <div class="views">● LIVE</div>
    </div>
  </div>

<script>
function playChannel(channelId){
  document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/live_stream?channel=${channelId}`;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  event.currentTarget.classList.add('active');
}
</script>
</body>
</html>
