<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV Bangladesh</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body {margin:0;font-family:Arial,sans-serif;background:#111;color:#fff;}
header {background:#000;padding:15px;text-align:center;}
header h2 {margin:0;color:red;}
.container {padding:10px;}
video {width:100%;max-height:60vh;background:#000;border-radius:8px;}
.channel-list {display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:15px;}
.channel {background:#222;padding:10px;text-align:center;border-radius:6px;cursor:pointer;}
.channel:hover {background:red;}
</style>
</head>
<body>
<header><h2>Live TV Bangladesh</h2></header>
<div class="container">
  <video id="video" controls autoplay></video>
  <div class="channel-list" id="channels"></div>
</div>

<script>
const proxy = "https://corsproxy.io/?";
const video = document.getElementById('video');

const channels = [
  {name:"Somoy TV", url:"https://live1.livetvsd.com:19360/hls/live2.m3u8"},
  {name:"Jamuna TV", url:"https://live1.livetvsd.com:19360/hls/live4.m3u8"},
  {name:"News24", url:"https://live1.livetvsd.com:19360/hls/live5.m3u8"},
  {name:"Independent TV", url:"https://live1.livetvsd.com:19360/hls/live6.m3u8"}
];

const channelList = document.getElementById('channels');
channels.forEach(ch => {
  let div = document.createElement('div');
  div.className = 'channel';
  div.innerText = ch.name;
  div.onclick = () => playChannel(ch.url);
  channelList.appendChild(div);
});

function playChannel(url) {
  console.log("Trying to play:", url);
  if(Hls.isSupported()) {
    let hls = new Hls();
    hls.loadSource(proxy + encodeURIComponent(url));
    hls.attachMedia(video);
    hls.on(Hls.Events.ERROR, (e,data) => console.log("HLS Error:", data));
  } else {
    video.src = proxy + encodeURIComponent(url);
  }
  video.play().catch(e => console.log("Play Error:", e));
}

playChannel(channels[0].url);
</script>
</body>
</html>
