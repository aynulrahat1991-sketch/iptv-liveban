<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bangla Live TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#fff}
.player{max-width:800px;margin:20px auto}
video{width:100%;height:220px;background:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:20px}
.card{background:#222;padding:10px;border-radius:8px;text-align:center;cursor:pointer}
.card.active{border:2px solid red}
.card img{width:100%;height:60px;object-fit:contain}
</style>
</head>
<body>

<div class="player">
  <video id="mainPlayer" controls autoplay muted playsinline></video>
  <div style="padding:10px">
    <strong id="channelName">Channel 24</strong>
  </div>
</div>

<div class="grid" id="channelGrid">
  <div class="card active" onclick="playChannel('https://live-hls-web-aja.prod.contus.us/AMGTV/bdbroadcastingtvltd/Bangladesh_TV/playlist.m3u8','Channel 24')">
    <img src="https://i.ibb.co/Y7WQZQ8/ptvsports.png">
    <p>Channel 24</p>
  </div>

  <div class="card" onclick="playChannel('https://live-hls-web-aja.prod.contus.us/AMGTV/bdbroadcastingtvltd/Jamuna_TV/playlist.m3u8','Jamuna TV')">
    <img src="https://i.ibb.co/FWmQ8WQ/tsports.png">
    <p>Jamuna TV</p>
  </div>

  <div class="card" onclick="playChannel('https://live-hls-web-aja.prod.contus.us/AMGTV/bdbroadcastingtvltd/Somoy_TV/playlist.m3u8','Somoy TV')">
    <img src="https://i.ibb.co/Y7WQZQ8/ptvsports.png">
    <p>Somoy TV</p>
  </div>
</div>

<script>
var video = document.getElementById('mainPlayer');
var hls;

function playChannel(m3u8Link, name){
  document.getElementById('channelName').innerText = name;

  if(Hls.isSupported()){
    if(hls) hls.destroy();
    hls = new Hls();
    hls.loadSource(m3u8Link);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      video.play();
    });
  }
  else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = m3u8Link;
    video.play();
  }

  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  event.currentTarget.classList.add('active');
}

window.onload = function(){
  playChannel('https://live-hls-web-aja.prod.contus.us/AMGTV/bdbroadcastingtvltd/Bangladesh_TV/playlist.m3u8','Channel 24');
}
</script>
</body>
</html>
