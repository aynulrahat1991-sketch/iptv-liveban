<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV BD</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:sans-serif}
header{padding:15px;text-align:center;background:#1a1a1a;border-bottom:2px solid red}
header h2{color:red}
#player{width:100%;max-width:900px;margin:15px auto;background:#000}
video{width:100%;height:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:15px;max-width:1200px;margin:0 auto}
.card{background:#1e1e1e;padding:12px;border-radius:6px;text-align:center;cursor:pointer;border:1px solid #333}
.card:hover{background:#2a2a2a;border-color:red}
.card p{font-size:14px}
</style>
</head>
<body>

<header>
  <h2>Live TV Bangladesh</h2>
</header>

<div id="player">
  <video id="video" controls autoplay muted></video>
</div>

<div class="grid" id="channelList"></div>

<script>
const channels = [
  {name:"Channel 24", url:"https://cdn.jagobd.com/live/Channel24/index.m3u8"},
  {name:"Somoy TV", url:"https://cdn.jagobd.com/live/Somoy/index.m3u8"},
  {name:"Jamuna TV", url:"https://cdn.jagobd.com/live/Jamuna/index.m3u8"},
  {name:"News24", url:"https://cdn.jagobd.com/live/News24/index.m3u8"},
  {name:"Independent TV", url:"https://cdn.jagobd.com/live/Independent/index.m3u8"},
  {name:"DBC News", url:"https://cdn.jagobd.com/live/DBC/index.m3u8"},
  {name:"Channel i", url:"https://cdn.jagobd.com/live/Channeli/index.m3u8"},
  {name:"RTV", url:"https://cdn.jagobd.com/live/RTV/index.m3u8"},
  {name:"Boishakhi TV", url:"https://cdn.jagobd.com/live/Boishakhi/index.m3u8"},
  {name:"ATN News", url:"https://cdn.jagobd.com/live/ATN/index.m3u8"},
  {name:"ATN Bangla", url:"https://cdn.jagobd.com/live/ATNBangla/index.m3u8"},
  {name:"NTV", url:"https://cdn.jagobd.com/live/NTV/index.m3u8"},
  {name:"Deepto TV", url:"https://cdn.jagobd.com/live/Deepto/index.m3u8"},
  {name:"BanglaVision", url:"https://cdn.jagobd.com/live/Banglavision/index.m3u8"},
  {name:"GTV", url:"https://cdn.jagobd.com/live/GTV/index.m3u8"},
  {name:"Ekushey TV", url:"https://cdn.jagobd.com/live/ETV/index.m3u8"},
  {name:"SA TV", url:"https://cdn.jagobd.com/live/SATV/index.m3u8"},
  {name:"Bijoy TV", url:"https://cdn.jagobd.com/live/Bijoy/index.m3u8"}
];

const video = document.getElementById('video');
const list = document.getElementById('channelList');
let hls = null;

function playChannel(url){
  if(hls) hls.destroy();

  if(Hls.isSupported()){
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){
      video.play();
    });
  }else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = url;
    video.play();
  }
}

channels.forEach((ch,index)=>{
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `<p>${ch.name}</p>`;
  div.onclick = ()=>playChannel(ch.url);
  list.appendChild(div);
});

// First channel auto play
playChannel(channels[0].url);
</script>

</body>
</html>
