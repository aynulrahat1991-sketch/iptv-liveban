<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV BD</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
body {margin:0;font-family:Arial;background:#0a0a0a;color:#fff;}
header {background:#000;padding:15px;text-align:center;border-bottom:2px solid #e50914;}
header h2 {margin:0;color:#e50914;}
.container {padding:15px;max-width:1000px;margin:auto;}
video {width:100%;max-height:65vh;background:#000;border-radius:8px;}
.channel-list {display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:15px;}
.channel {background:#1e1e1e;padding:15px;text-align:center;border-radius:6px;cursor:pointer;font-size:15px;border:1px solid #333;transition:0.2s;}
.channel:hover {background:#e50914;transform:scale(1.05);}
</style>
</head>
<body>
<header><h2>Live TV Bangladesh</h2></header>
<div class="container">
  <video id="video" controls autoplay muted></video>
  <div class="channel-list" id="channels"></div>
</div>

<script>
const channels = [
  {name: "Somoy TV", url: "https://somoytv-live.akamaized.net/hls/live/2022420/somoytv/index.m3u8"},
  {name: "Jamuna TV", url: "https://live.jamunatv.tv/hls/live/2018098/jamunatv/index.m3u8"},
  {name: "Channel 24", url: "https://livecdn.channel24bd.tv/live/ecnnlive/playlist.m3u8"},
  {name: "ATN News", url: "https://cdn-01.bongo-solutions.com/live/1787/atnnews/index.m3u8"},
  {name: "GTV", url: "https://gazi-live.s3.ap-southeast-1.amazonaws.com/live/gtv/index.m3u8"},
  {name: "Deepto TV", url: "https://cdn-01.bongo-solutions.com/live/1789/deeptotv/index.m3u8"}
];

const video = document.getElementById('video');
const channelList = document.getElementById('channels');

function loadChannels() {
  channels.forEach((ch, i) => {
    let div = document.createElement('div');
    div.className = 'channel';
    div.innerText = ch.name;
    div.onclick = () => playChannel(ch.url, i);
    channelList.appendChild(div);
  });
  playChannel(channels[0].url, 0);
}

function playChannel(url, index) {
  if(window.hls) window.hls.destroy();

  document.querySelectorAll('.channel').forEach(c => c.style.background = '#1e1e1e');
  document.querySelectorAll('.channel')[index].style.background = '#e50914';

  if(Hls.isSupported()) {
    window.hls = new Hls();
    window.hls.loadSource(url);
    window.hls.attachMedia(video);
  } else {
    video.src = url;
  }
  video.play().catch(e => console.log(e));
}

loadChannels();
</script>
</body>
</html>
