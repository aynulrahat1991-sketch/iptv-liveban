<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV Test</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif}
.player{max-width:700px;margin:20px auto}
iframe{width:100%;height:350px;border:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:20px}
.card{background:#222;padding:15px;border-radius:8px;text-align:center;cursor:pointer}
.card.active{border:2px solid red;background:#333}
</style>
</head>
<body>

<div class="player">
  <iframe id="ytPlayer" src="https://www.youtube.com/embed/live_stream?channel=UCUo_ITVZtR1XbZ6UMiEeqw&autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<div class="grid">
  <div class="card active" onclick="changeChannel('UCUo_ITVZtR1XbZ6UMiEeqw', this)">
    <p>Channel 24</p>
  </div>

  <div class="card" onclick="changeChannel('UCNEBYO4dILq7CyIhB_UA', this)">
    <p>T Sports</p>
  </div>
</div>

<script>
function changeChannel(channelId, element){
  document.getElementById('ytPlayer').src = 'https://www.youtube.com/embed/live_stream?channel=' + channelId + '&autoplay=1';
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  element.classList.add('active');
}
</script>

</body>
</html>
