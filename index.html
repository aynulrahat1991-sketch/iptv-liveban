<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV Working</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center}
.player{max-width:900px;margin:20px auto;padding:0 10px}
iframe{width:100%;height:450px;border:none;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:20px}
.card{background:#222;padding:15px;border-radius:8px;cursor:pointer}
.card.active{border:2px solid red;background:#330000}
.card p{margin:0;font-size:14px}
</style>
</head>
<body>

<h2>Live TV - Working Channels</h2>

<div class="player">
  <iframe id="ytPlayer" src="https://www.youtube.com/embed/6uGPhnhhqVQ?autoplay=1&mute=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
</div>

<div class="grid">
  <div class="card active" onclick="changeChannel('6uGPhnhhqVQ', this)">
    <p>Channel 24</p>
  </div>

  <div class="card" onclick="changeChannel('M0-vddX09TM', this)">
    <p>Somoy TV</p>
  </div>

  <div class="card" onclick="changeChannel('bTxNxcc1hBc', this)">
    <p>ATN News</p>
  </div>

  <div class="card" onclick="changeChannel('pVw5fZnF2S0', this)">
    <p>Jamuna TV</p>
  </div>

  <div class="card" onclick="changeChannel('G2QAf4Vab5E', this)">
    <p>News24</p>
  </div>

  <div class="card" onclick="changeChannel('wqi-Q2U1n_s', this)">
    <p>Independent TV</p>
  </div>

  <div class="card" onclick="changeChannel('UEAA_Qjjepg', this)">
    <p>DBC News</p>
  </div>

  <div class="card" onclick="changeChannel('8CrPFdM_fvE', this)">
    <p>Channel i</p>
  </div>

  <div class="card" onclick="changeChannel('ykVMkYUQRZU', this)">
    <p>RTV</p>
  </div>

  <div class="card" onclick="changeChannel('Yy8T--5fXY0', this)">
    <p>Boishakhi TV</p>
  </div>
</div>

<script>
function changeChannel(videoId, element){
  document.getElementById('ytPlayer').src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1&mute=1';
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  element.classList.add('active');
}
</script>
</body>
</html>
